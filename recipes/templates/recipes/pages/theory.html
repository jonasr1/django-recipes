<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theory</title>
</head>
<body>
  <h1>Theory</h1>
  <p>Qtd. total de receitas: {{ number_of_recipes }}</p>
  {% for recipe in recipes %}
    <li>{{ recipe.id }} {{ recipe.author__username }} {{ recipe.title }} {{ recipe.is_published }}</li>
  {% empty %}
    <p>No recipes found</p>
  {% endfor %}
  <p>{{ recipes }}</p>
</body>
</html>
